name: Weekly README repo table
on:
  workflow_dispatch:
  schedule:
    # Each Saturday at 05:17 Melbourne local time (AEST/AEDT).
    # The early start leaves room for GitHub's best-effort scheduling delays.
    - cron: '17 5 * * 6'
      timezone: 'Australia/Melbourne'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Record actual schedule time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo '### README updater timing'
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Scheduled cron (Melbourne): ${EVENT_SCHEDULE:-manual dispatch}"
            echo "- Actual start (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Actual start (Melbourne): $(TZ=Australia/Melbourne date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Update table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update_repo_table.sh
      - name: Generate weekly report
        shell: bash
        run: |
          {
            echo "# Weekly repository update"
            echo
            echo "Changes since the previous merged repository-table snapshot (normally one week)."
            echo
            if ! git diff --quiet -- README.md starred.md licenses.md; then
              git diff -- README.md starred.md licenses.md | python3 scripts/parse_diff.py
            else
              echo "No tracked table changes were detected."
            fi
            echo
            echo "_Automatically generated by GitHub Actions. Full before/after changes are also available in Files changed._"
          } > pr-body.md

          # GitHub limits PR description size. Keep the entire appendix in a
          # versioned file when a busy week produces an oversized description.
          if [ "$(wc -c < pr-body.md)" -gt 60000 ]; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("pr-body.md")
          body = path.read_text()
          head, separator, appendix = body.partition("## Detailed Repository Changes\n")
          if not separator:
              raise SystemExit("Cannot locate detailed records in oversized report")
          Path("weekly-repo-details.md").write_text(
              "# Weekly repository change details\n\n" +
              "## Detailed Repository Changes\n" + appendix
          )
          path.write_text(
              head + "## Detailed Repository Changes\n\n"
              "<details>\n"
              "<summary>Full appendix is in a separate file for this large update</summary>\n\n"
              "Open `weekly-repo-details.md` in this pull request's **Files changed** tab "
              "to read every repository record. The file is committed with this update.\n\n"
              "</details>\n"
          )
          PY
          else
            # Do not retain a stale spillover report from an earlier large week.
            rm -f weekly-repo-details.md
          fi

          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update weekly repo table
          title: Weekly repo table update
          body-path: pr-body.md
          branch: update-repo-table
          delete-branch: true
