name: Update README repo table
on:
  workflow_dispatch:
  schedule:
    # Target completion: before 06:00 AEDT / 07:00 AEST the following morning.
    # Start at 21:17 Melbourne time the preceding evening to allow for the
    # multi-hour delays observed with GitHub Actions scheduled workflows.
    # This is best-effort: GitHub may still delay or drop scheduled runs.
    - cron: '17 21 * * *'
      timezone: 'Australia/Melbourne'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Record actual schedule time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo '### README updater timing'
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Scheduled cron (UTC): ${EVENT_SCHEDULE:-manual dispatch}"
            echo "- Actual start (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Actual start (Melbourne): $(TZ=Australia/Melbourne date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Update table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update_repo_table.sh
      - name: Generate PR summary
        shell: bash
        run: |
          {
            echo "## Summary"
            echo
            echo "This PR updates the README repository table."
            echo
            if ! git diff --quiet && [ -f scripts/parse_diff.py ]; then
              git diff | python3 scripts/parse_diff.py
              echo
            fi
            echo "## What changed"
            echo
            if git diff --quiet; then
              echo "- No changes detected."
            else
              echo "- Regenerated the repo table."
              echo
              echo "## Files changed"
              echo
              git diff --name-only | sed 's/^/- `/; s/$/`/'
              echo
              echo "## Diff stat"
              echo
              echo '```text'
              git diff --stat
              echo '```'
            fi
            echo
            echo "## Notes"
            echo
            echo "- Auto-generated by GitHub Actions."
          } > pr-body.md

          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update repo table
          title: Update repo table
          body-path: pr-body.md
          branch: update-repo-table
          delete-branch: true
